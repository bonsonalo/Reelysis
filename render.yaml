# Render blueprint.
# Free tier: API + Celery in one Web Service (scripts/start.sh).
# Paid upgrade: set web startCommand to uvicorn only and enable the worker service.

services:
  - type: web
    name: reelysis-api
    runtime: python
    rootDir: backend
    preDeployCommand: python scripts/run_migrations.py
    startCommand: bash scripts/start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      # Set FRONTEND_URL, CORS_ORIGINS, DB_URL, REDIS_URL, secrets, etc. in the dashboard.

  # Optional paid Background Worker (~$7/mo Starter). Prefer this when budget allows.
  # - type: worker
  #   name: reelysis-worker

# Render blueprint — paid production layout:
#   Web Service (API)  → uvicorn only
#   Background Worker  → Celery (~$7/mo Starter)
# Link the same Render Redis + set DB_URL / secrets in the dashboard for BOTH services.

services:
  - type: web
    name: reelysis-api
    runtime: python
    rootDir: backend
    preDeployCommand: python scripts/run_migrations.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Set FRONTEND_URL, CORS_ORIGINS, DB_URL, REDIS_URL, SMTP_*, secrets, etc. in the dashboard.

  - type: worker
    name: reelysis-worker
    runtime: python
    rootDir: backend
    startCommand: bash scripts/worker.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      # split = separate "default" and "slow" Celery processes (~2x RAM); single = one process.
      - key: WORKER_MODE
        value: split
      - key: AUTO_SYNC_ENABLED
        value: "true"
      # Copy the same env vars as reelysis-api (DB_URL, REDIS_URL, GEMINI_*, SMTP_*, etc.).
      # If this runs as a free Web Service instead (sleeps when idle), set WORKER_WAKE_URL to its
      # public URL on both services.
